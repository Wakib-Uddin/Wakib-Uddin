<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Wakib Uddin — Data Analysis and Python</title>
  <desc id="desc">A custom dark data dashboard illustration with animated chart bars, a moving data line and subtle signal pulses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1720"/><stop offset="1" stop-color="#102d2b"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#43d6b0"/><stop offset="1" stop-color="#8be7cf"/></linearGradient>
    <pattern id="grid" width="48" height="42" patternUnits="userSpaceOnUse"><path d="M48 0H0V42" fill="none" stroke="#9cc8bb" stroke-opacity=".10" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <path d="M40 42H1160" stroke="#b6d9cf" stroke-opacity=".18"/>
  <circle cx="62" cy="26" r="5" fill="#43d6b0"/><circle cx="82" cy="26" r="5" fill="#f0c878" opacity=".8"/><circle cx="102" cy="26" r="5" fill="#b6d9cf" opacity=".5"/>
  <text x="54" y="112" fill="#8be7cf" font-family="monospace" font-size="15" letter-spacing="4">DATA / PYTHON / SQL</text>
  <text x="52" y="177" fill="#f3f8f6" font-family="Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="-2">Wakib Uddin</text>
  <text x="56" y="215" fill="#b8ccc6" font-family="Arial, sans-serif" font-size="21">Aspiring Data Analyst · CSE Graduate</text>
  <path d="M56 250H385" stroke="#43d6b0" stroke-width="2" stroke-linecap="round"/>
  <text x="56" y="286" fill="#9fbab1" font-family="monospace" font-size="13" letter-spacing="1.5">CLEAN  →  EXPLORE  →  EXPLAIN</text>
  <g transform="translate(610 70)">
    <rect x="0" y="0" width="535" height="235" rx="12" fill="#07131a" fill-opacity=".58" stroke="#9cc8bb" stroke-opacity=".2"/>
    <text x="24" y="30" fill="#8ba99f" font-family="monospace" font-size="11" letter-spacing="2">ANALYTICS / LIVE SIGNAL</text>
    <g stroke="#a5c9bd" stroke-opacity=".13" stroke-dasharray="3 7">
      <path d="M25 65H510M25 110H510M25 155H510M25 200H510"/>
      <path d="M80 48V210M160 48V210M240 48V210M320 48V210M400 48V210M480 48V210"/>
    </g>
    <g fill="url(#mint)" opacity=".8">
      <rect x="54" y="145" width="25" height="55" rx="4"><animate attributeName="height" values="55;82;55" dur="4.2s" repeatCount="indefinite"/><animate attributeName="y" values="145;118;145" dur="4.2s" repeatCount="indefinite"/></rect>
      <rect x="112" y="118" width="25" height="82" rx="4"><animate attributeName="height" values="82;48;82" dur="3.6s" repeatCount="indefinite"/><animate attributeName="y" values="118;152;118" dur="3.6s" repeatCount="indefinite"/></rect>
      <rect x="170" y="132" width="25" height="68" rx="4"><animate attributeName="height" values="68;95;68" dur="4.8s" repeatCount="indefinite"/><animate attributeName="y" values="132;105;132" dur="4.8s" repeatCount="indefinite"/></rect>
      <rect x="228" y="91" width="25" height="109" rx="4"><animate attributeName="height" values="109;76;109" dur="3.9s" repeatCount="indefinite"/><animate attributeName="y" values="91;124;91" dur="3.9s" repeatCount="indefinite"/></rect>
      <rect x="286" y="111" width="25" height="89" rx="4"><animate attributeName="height" values="89;120;89" dur="4.4s" repeatCount="indefinite"/><animate attributeName="y" values="111;80;111" dur="4.4s" repeatCount="indefinite"/></rect>
    </g>
    <path d="M42 125 C90 104 105 145 151 112 S225 82 266 105 S339 65 380 88 S444 55 490 72" fill="none" stroke="#f0c878" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 8" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="490" cy="72" r="5" fill="#f0c878"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.55;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="25" y="222" fill="#8ba99f" font-family="monospace" font-size="10">PYTHON</text><text x="115" y="222" fill="#8ba99f" font-family="monospace" font-size="10">PANDAS</text><text x="215" y="222" fill="#8ba99f" font-family="monospace" font-size="10">SQL</text><text x="285" y="222" fill="#8ba99f" font-family="monospace" font-size="10">INSIGHTS</text>
  </g>
</svg>